spring.application.name=inventory-service
server.port=8085

#MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/inventory
spring.datasource.username=root
spring.datasource.password={cipher}5949f2d5e0ab20c375e518e9948d280788c62716ee00d94686adfe1a9a4118249bc964d05e2e881a1fdcfd8f6470e167
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

#Actuator health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


#Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [inventory-service] %-5level %logger{36} - %msg%n

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
