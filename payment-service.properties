spring.application.name=payment-service
server.port=8022
#MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/payment
spring.datasource.username=root
spring.datasource.password={cipher}5949f2d5e0ab20c375e518e9948d280788c62716ee00d94686adfe1a9a4118249bc964d05e2e881a1fdcfd8f6470e167
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#Kafka Producer 
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#Kafka Consumer
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# retry and backoff
spring.kafka.listener.max-attempts=3
spring.kafka.listener.backoff.initial-interval=1000
spring.kafka.listener.backoff.max-interval=5000
spring.kafka.listener.backoff.multiplier=2.0

#LOGS Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [order-service] %-5level %logger{36} - %msg%n

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
